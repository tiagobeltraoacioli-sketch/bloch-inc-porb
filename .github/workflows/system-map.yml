name: System Map contracts
on:
  push:
    paths: ['graphus/assets/map.*', 'graphus/assets/system_*.js', 'graphus/map.html', 'tests/*system_map*', '.github/workflows/system-map.yml']
  pull_request:
    paths: ['graphus/assets/map.*', 'graphus/assets/system_*.js', 'graphus/map.html', 'tests/*system_map*', '.github/workflows/system-map.yml']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/test_system_map.mjs
      - run: node --check graphus/assets/map.js
      - run: node --check graphus/assets/system_workbench.js
