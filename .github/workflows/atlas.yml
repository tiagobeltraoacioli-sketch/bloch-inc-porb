name: Data Atlas contracts
on:
  push:
    paths: ['graphus/assets/atlas_*', 'graphus/assets/catalog.*', 'graphus/catalog.html', 'graphus/chain/atlas-api.js', 'graphus/chain/network-graph.js', 'graphus/assets/system_evidence.js', 'tests/test_network_graph.mjs', 'graphus/functions/**', 'portal/atlas*', 'portal/router.js', 'portal/migrations/**', 'site/atlas.html', 'site/portal/atlas*', 'site/portal/portal.js', 'site/portal/portal.css', 'site/portal/index.html', 'scripts/*atlas*', 'tests/*atlas*', '.github/workflows/atlas.yml']
  pull_request:
    paths: ['graphus/assets/atlas_*', 'graphus/assets/catalog.*', 'graphus/catalog.html', 'graphus/chain/atlas-api.js', 'graphus/chain/network-graph.js', 'graphus/assets/system_evidence.js', 'tests/test_network_graph.mjs', 'graphus/functions/**', 'portal/atlas*', 'portal/router.js', 'portal/migrations/**', 'site/atlas.html', 'site/portal/atlas*', 'site/portal/portal.js', 'site/portal/portal.css', 'site/portal/index.html', 'scripts/*atlas*', 'tests/*atlas*', '.github/workflows/atlas.yml']
permissions:
  contents: read
jobs:
  atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python3 scripts/build_portal_modules.py
      - run: node --test tests/test_network_graph.mjs tests/test_atlas.mjs tests/test_porb_atlas.mjs tests/test_atlas_context.mjs tests/test_atlas_comparison.mjs tests/test_atlas_comparison_view.mjs tests/test_atlas_paths.mjs tests/test_atlas_motifs.mjs tests/test_atlas_reports.mjs tests/test_atlas_motif_reports.mjs tests/test_atlas_cases.mjs tests/test_atlas_reviews.mjs tests/test_atlas_audit.mjs tests/test_atlas_audit_view.mjs tests/test_atlas_timeline.mjs tests/test_graphus_api.mjs tests/test_evidence_graph.mjs
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps webkit
      - run: node scripts/check_atlas_browser.mjs
      - run: node scripts/check_atlas_cases_browser.mjs
      - run: node scripts/check_atlas_reviews_browser.mjs
      - run: node scripts/check_atlas_audit_browser.mjs
      - run: node scripts/check_atlas_timeline_browser.mjs
      - run: node scripts/check_atlas_motifs_browser.mjs
      - run: node scripts/check_atlas_motif_reports_browser.mjs
      - run: node scripts/check_atlas_report_viewers_browser.mjs
