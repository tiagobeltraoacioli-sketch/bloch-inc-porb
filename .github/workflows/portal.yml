name: Private portal checks
on:
  push:
    paths: ['portal/**', 'site/portal/**', 'site/functions/**', 'tests/*porb*', 'space/public/assets/science.js', '.github/workflows/portal.yml']
  pull_request:
    paths: ['portal/**', 'site/portal/**', 'site/functions/**', 'tests/*porb*', 'space/public/assets/science.js', '.github/workflows/portal.yml']
permissions:
  contents: read
jobs:
  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/test_porb_model.mjs tests/test_porb_portal.mjs tests/test_space_science.mjs
      - run: node --check site/portal/portal.js
