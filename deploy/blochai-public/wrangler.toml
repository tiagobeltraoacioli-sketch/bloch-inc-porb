name = "blochai-public"
main = "worker.js"
compatibility_date = "2026-09-28"
# Same-zone page passthrough must reach Pages, not recursively call this Worker.
compatibility_flags = ["global_fetch_private_origin"]
workers_dev = false
preview_urls = false

routes = [
  { pattern = "blochai.xyz", custom_domain = true },
  { pattern = "https://bloch-graphus.xyz/", zone_name = "bloch-graphus.xyz" },
  { pattern = "https://bloch.space/", zone_name = "bloch.space" },
  { pattern = "https://bloch.space/app/*", zone_name = "bloch.space" },
  { pattern = "https://blochl1.com/", zone_name = "blochl1.com" },
  { pattern = "https://bloch-graphus.xyz/blochai-assistant.js", zone_name = "bloch-graphus.xyz" },
  { pattern = "https://bloch-graphus.xyz/blochai-assistant.css", zone_name = "bloch-graphus.xyz" },
  { pattern = "https://bloch-graphus.xyz/api/blochai/tasks", zone_name = "bloch-graphus.xyz" },
  { pattern = "https://bloch-graphus.xyz/api/blochai/tasks/*", zone_name = "bloch-graphus.xyz" },
  { pattern = "https://bloch.space/blochai-assistant.js", zone_name = "bloch.space" },
  { pattern = "https://bloch.space/blochai-assistant.css", zone_name = "bloch.space" },
  { pattern = "https://bloch.space/api/blochai/tasks", zone_name = "bloch.space" },
  { pattern = "https://bloch.space/api/blochai/tasks/*", zone_name = "bloch.space" },
  { pattern = "https://blochl1.com/blochai-assistant.js", zone_name = "blochl1.com" },
  { pattern = "https://blochl1.com/blochai-assistant.css", zone_name = "blochl1.com" },
  { pattern = "https://blochl1.com/api/blochai/tasks", zone_name = "blochl1.com" },
  { pattern = "https://blochl1.com/api/blochai/tasks/*", zone_name = "blochl1.com" }
]

[vars]
ENABLE_PUBLIC_LINK = "true"
ENABLE_PUBLIC_ASSISTANT = "true"
PUBLIC_BLOCHAI_API_URL = "https://blochai-origin.posternlabs.com"
PUBLIC_BLOCHAI_DAILY_LIMIT = "200"

[[d1_databases]]
binding = "BLOCHAI_PUBLIC_DB"
database_name = "blochai-public-assistant"
database_id = "1a920ae8-1e14-48a8-ae9c-7e852ca262d1"
migrations_dir = "migrations"

[assets]
directory = "../../.data/blochai-public-assets"
binding = "ASSETS"
run_worker_first = true
